services:
  app:
    image: ghcr.io/ccweerasinghe1994/hr-dashboard-v2:ccf4f63
    container_name: hr-dashboard
    restart: unless-stopped

    ports:
      - "127.0.0.1:3000:3000"

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s