services:
  app:
    image: ghcr.io/ccweerasinghe1994/hr-dashboard-v2:de0fe54
    container_name: hr-dashboard
    restart: unless-stopped

    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL is required}
      TENANT_BOOTSTRAP_SECRET: ${TENANT_BOOTSTRAP_SECRET:?TENANT_BOOTSTRAP_SECRET is required}
      LEGAL_IDENTIFIER_ENCRYPTION_KEY: ${LEGAL_IDENTIFIER_ENCRYPTION_KEY:?LEGAL_IDENTIFIER_ENCRYPTION_KEY is required}
      NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${NEXT_SERVER_ACTIONS_ENCRYPTION_KEY:?NEXT_SERVER_ACTIONS_ENCRYPTION_KEY is required}

    ports:
      - "127.0.0.1:3000:3000"

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s