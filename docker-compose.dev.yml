services:
  postgres:
    image: postgres:17-alpine
    container_name: hr-dashboard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hr_dashboard
      POSTGRES_USER: hr_migrator
      POSTGRES_PASSWORD: dev_migrator_password
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - hr-dashboard-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hr_migrator -d hr_dashboard"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hr-dashboard-postgres-data:
