name: Build and Push Image

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: hr_dashboard_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hr_dashboard_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MIGRATION_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/hr_dashboard_test
      DATABASE_URL: postgres://hr_app:test_runtime_password@127.0.0.1:5432/hr_dashboard_test
      TEST_ADMIN_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/hr_dashboard_test
      TEST_DATABASE_URL: postgres://hr_app:test_runtime_password@127.0.0.1:5432/hr_dashboard_test
      BETTER_AUTH_SECRET: test-better-auth-secret-at-least-32-characters
      BETTER_AUTH_URL: http://localhost:3000
      TENANT_BOOTSTRAP_SECRET: test-bootstrap-secret
      LEGAL_IDENTIFIER_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit tests
        run: bun run test:unit

      - name: Create restricted runtime role
        run: >-
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d hr_dashboard_test
          -v ON_ERROR_STOP=1
          -c "CREATE ROLE hr_app LOGIN PASSWORD 'test_runtime_password' NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;"

      - name: Migrate empty database
        run: bun run db:migrate

      - name: Verify migrations are repeatable
        run: bun run db:migrate

      - name: Run integration tests
        run: bun run test:integration

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

  build-and-push:
    if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image tag
        id: tag
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY}:${SHORT_SHA}"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.tag.outputs.image }}
          build-args: |
            NEXT_SERVER_ACTIONS_ENCRYPTION_KEY=${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}

      - name: Update compose image tag
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          path = Path('docker-compose.yml')
          content = path.read_text()
          new = f'ghcr.io/ccweerasinghe1994/hr-dashboard-v2:${{ steps.tag.outputs.short_sha }}'
          updated, count = re.subn(
            r'ghcr\.io/ccweerasinghe1994/hr-dashboard-v2:[^\s]+',
            new,
            content,
            count=1,
          )
          if count != 1:
            raise SystemExit('Expected image tag not found in docker-compose.yml')
          path.write_text(updated)
          PY

      - name: Commit updated compose file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docker-compose.yml
          if git diff --cached --quiet; then
            echo "No compose update to commit"
            exit 0
          fi
          git commit -m "chore: update compose image tag to ${{ steps.tag.outputs.short_sha }}"
          git push origin HEAD:${GITHUB_REF_NAME}
